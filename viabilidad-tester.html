<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viabilidad Económica — Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; padding: 2rem; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: #666; margin-bottom: 2rem; }
  .card { background: white; border-radius: 12px; border: 1px solid #e5e5e5; padding: 1.5rem; margin-bottom: 1.5rem; }
  label { display: block; font-size: 13px; font-weight: 500; color: #444; margin-bottom: 6px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input, select { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; color: #1a1a1a; background: white; }
  input:focus, select:focus { outline: none; border-color: #555; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { margin-top: 1.5rem; width: 100%; padding: 12px; background: #1a1a1a; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; }
  button:hover { background: #333; }
  button:disabled { background: #999; cursor: not-allowed; }
  .status { margin-top: 1rem; padding: 12px 16px; border-radius: 8px; font-size: 14px; display: none; }
  .status.loading { background: #EAF3DE; color: #3B6D11; display: block; }
  .status.error   { background: #FCEBEB; color: #A32D2D; display: block; }

  .result { display: none; }
  .result.visible { display: block; }

  .precios-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 1rem 0; }
  .precio-card { background: #f9f9f9; border-radius: 8px; padding: 1rem; text-align: center; border: 1px solid #eee; }
  .precio-label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .precio-valor { font-size: 24px; font-weight: 600; color: #1a1a1a; }
  .precio-min .precio-valor { color: #3B6D11; }
  .precio-max .precio-valor { color: #D85A30; }

  .meta-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
  .meta-row:last-child { border-bottom: none; }
  .meta-key { color: #888; }
  .meta-val { font-weight: 500; }

  .detalle-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 1rem; }
  .detalle-table th { text-align: left; padding: 8px; background: #f5f5f5; font-weight: 500; color: #666; border-radius: 4px; }
  .detalle-table td { padding: 8px; border-bottom: 1px solid #f0f0f0; }
  .detalle-table a { color: #185FA5; text-decoration: none; font-size: 12px; }
  .badge-ok { background: #EAF3DE; color: #3B6D11; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .badge-ko { background: #f5f5f5; color: #888; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .aviso { background: #FAEEDA; color: #854F0B; border-radius: 8px; padding: 12px 16px; font-size: 14px; margin-top: 1rem; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #3B6D11; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<h1>Viabilidad Económica</h1>
<p class="subtitle">Busca competencia activa en el país seleccionado y extrae precios de sus landing pages.</p>

<div class="card">
  <label>Nombre del producto</label>
  <input type="text" id="product_name" value="Interactive Pet Ball" placeholder="ej. Interactive Pet Ball">

  <label>Keyword Meta (inglés)</label>
  <input type="text" id="meta_keyword" value="smart dog ball" placeholder="ej. smart dog ball">

  <label>Keyword Trends (idioma local) <span style="color:#aaa;font-weight:400">— opcional, si viene se usa directamente</span></label>
  <input type="text" id="trends_keyword" value="pelota interactiva perro" placeholder="ej. pelota interactiva perro">

  <div class="row">
    <div>
      <label>País</label>
      <select id="country">
        <option value="ES" selected>ES — España</option>
        <option value="DE">DE — Alemania</option>
        <option value="FR">FR — Francia</option>
        <option value="IT">IT — Italia</option>
        <option value="UK">UK — Reino Unido</option>
        <option value="US">US — EE.UU.</option>
        <option value="PT">PT — Portugal</option>
        <option value="NL">NL — Países Bajos</option>
        <option value="BE">BE — Bélgica</option>
        <option value="PL">PL — Polonia</option>
      </select>
    </div>
    <div>
      <label>Ventana temporal (días)</label>
      <input type="number" id="days" value="7" min="1" max="30">
    </div>
  </div>

  <button id="btn" onclick="lanzar()">Lanzar análisis de viabilidad</button>
  <div class="status" id="status"></div>
</div>

<div class="result card" id="result">
  <div id="result-content"></div>
</div>

<script>
async function lanzar() {
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  const content = document.getElementById('result-content');

  const body = {
    product_name:   document.getElementById('product_name').value.trim(),
    meta_keyword:   document.getElementById('meta_keyword').value.trim(),
    trends_keyword: document.getElementById('trends_keyword').value.trim() || undefined,
    country:        document.getElementById('country').value,
    days:           parseInt(document.getElementById('days').value) || 7,
  };

  if (!body.product_name || !body.meta_keyword) {
    status.className = 'status error';
    status.textContent = 'Rellena al menos el nombre del producto y la keyword Meta.';
    return;
  }

  btn.disabled = true;
  result.className = 'result';
  status.className = 'status loading';
  status.innerHTML = '<span class="spinner"></span>Lanzando actor Apify y esperando resultados... esto puede tardar 1-3 minutos.';

  const start = Date.now();

  try {
    const res = await fetch('/viabilidad', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    const data = await res.json();
    const elapsed = ((Date.now() - start) / 1000).toFixed(0);

    if (!res.ok || data.error) {
      throw new Error(data.error || 'Error desconocido del servidor');
    }

    status.style.display = 'none';
    result.className = 'result visible';
    content.innerHTML = renderResultado(data, elapsed);

  } catch(e) {
    status.className = 'status error';
    status.textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

function renderResultado(d, elapsed) {
  const p = d.precios;
  let html = '';

  html += `<div class="meta-row"><span class="meta-key">Producto</span><span class="meta-val">${d.product_name}</span></div>`;
  html += `<div class="meta-row"><span class="meta-key">País</span><span class="meta-val">${d.country_name} (${d.country})</span></div>`;
  html += `<div class="meta-row"><span class="meta-key">Keyword usada</span><span class="meta-val">${d.keyword_usada} <span style="color:#aaa;font-weight:400;font-size:12px">(${d.keyword_source})</span></span></div>`;
  html += `<div class="meta-row"><span class="meta-key">Ventana</span><span class="meta-val">Últimos ${d.ventana_dias} días</span></div>`;
  html += `<div class="meta-row"><span class="meta-key">Anuncios encontrados</span><span class="meta-val">${d.anuncios_encontrados}</span></div>`;
  html += `<div class="meta-row"><span class="meta-key">Landings con precio</span><span class="meta-val">${d.landings_validas}</span></div>`;
  html += `<div class="meta-row"><span class="meta-key">Tiempo de análisis</span><span class="meta-val">${elapsed}s</span></div>`;

  if (!p) {
    html += `<div class="aviso" style="margin-top:1rem">${d.resumen}</div>`;
    return html;
  }

  html += `<div class="precios-grid" style="margin-top:1.5rem">
    <div class="precio-card precio-min">
      <div class="precio-label">Precio mínimo</div>
      <div class="precio-valor">${p.precio_minimo_fmt}</div>
    </div>
    <div class="precio-card">
      <div class="precio-label">Precio medio</div>
      <div class="precio-valor">${p.precio_medio_fmt}</div>
    </div>
    <div class="precio-card precio-max">
      <div class="precio-label">Precio máximo</div>
      <div class="precio-valor">${p.precio_maximo_fmt}</div>
    </div>
  </div>`;

  if (p.detalle && p.detalle.length > 0) {
    html += `<table class="detalle-table">
      <thead><tr><th>Dominio</th><th>Precio</th><th>URL</th></tr></thead><tbody>`;
    for (const item of p.detalle) {
      html += `<tr>
        <td>${item.domain}</td>
        <td><span class="badge-ok">${item.precio_fmt}</span></td>
        <td><a href="${item.url}" target="_blank">${item.url.substring(0,50)}...</a></td>
      </tr>`;
    }
    html += `</tbody></table>`;
  }

  return html;
}
</script>
</body>
</html>
